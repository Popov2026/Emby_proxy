# Version compilee pour Windows : emby_proxy.exe + service Windows (WinSW).
# Se declenche quand on pousse une etiquette vX.Y.Z, ou a la main
# (onglet Actions > Version Windows > Run workflow, avec un numero de version).
name: Version Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numero de version a publier (ex. 2.0.0) ; vide = simple essai"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -p no:anyio
      - name: Simulation d'attaques (59 attaques + utilisateur temoin)
        run: python tools/attack_simulation.py
      - name: Essai de bout en bout (utilisateur, quotas, page d'administration dans Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python tools/functional_check.py

  windows:
    needs: tests
    runs-on: windows-latest
    env:
      WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
      # Signature du code (SignPath Foundation) : faite seulement pour une vraie
      # version et une fois le secret SIGNPATH_API_TOKEN et la variable
      # SIGNPATH_ORGANIZATION_ID renseignes dans le depot (Settings > Secrets
      # and variables > Actions). Sans eux, la version sort non signee.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      RELEASE: ${{ github.ref_type == 'tag' || github.event.inputs.version != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependances
        run: pip install -r requirements.txt pyinstaller

      - name: Compilation de emby_proxy.exe
        run: >
          pyinstaller --onefile --console --name emby_proxy
          --hidden-import emby_quota --hidden-import emby_quota_i18n --hidden-import emby_proxy_lang
          emby_proxy.py

      # --- signature : l'exe compile ici est envoye a SignPath, qui verifie
      # qu'il vient bien de cette compilation, puis le rend signe ---
      - name: Signature - exe a signer
        id: unsigned
        if: env.RELEASE == 'true' && env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: emby_proxy-unsigned
          path: dist/emby_proxy.exe
          if-no-files-found: error

      - name: Signature - demande a SignPath (attend l'approbation)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'emby-proxy' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Signature - exe signe a la place de l'autre, verifie
        if: steps.unsigned.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item signed\emby_proxy.exe dist\emby_proxy.exe -Force
          $sig = Get-AuthenticodeSignature dist\emby_proxy.exe
          Write-Host "Signature : $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "exe non signe ou signature invalide" }

      - name: Assemblage du dossier
        shell: pwsh
        run: |
          $d = "dist\EmbyProxy"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist\emby_proxy.exe $d
          Invoke-WebRequest $env:WINSW_URL -OutFile "$d\EmbyProxy-service.exe"
          Copy-Item packaging\windows\* $d
          Copy-Item emby_quota.ini.example, emby_proxy.example.ini $d
          $v = (& "$d\emby_proxy.exe" --version)
          Write-Host "Version : $v"
          if ($v -notmatch "Emby Proxy") { exit 1 }

      - name: Archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME }
                 elseif ("${{ github.event.inputs.version }}") { "v${{ github.event.inputs.version }}" }
                 else { "dev" }
          Compress-Archive -Path dist\EmbyProxy -DestinationPath "EmbyProxy-$tag-windows.zip"
          "ZIP=EmbyProxy-$tag-windows.zip" | Out-File -Append $env:GITHUB_ENV
          "TAG=$tag" | Out-File -Append $env:GITHUB_ENV

      # --- essais reels sur Windows, dans une copie (l'archive reste vierge) ---
      - name: Essai - chiffrement DPAPI de la cle API
        shell: pwsh
        run: |
          Expand-Archive $env:ZIP -DestinationPath essai1
          cd essai1\EmbyProxy
          "[emby]`napi_key = CLE-DE-TEST-123`n[log]`nfile = proxy.log`n" | Out-File -Encoding utf8 emby_proxy.ini
          $p = Start-Process .\emby_proxy.exe -ArgumentList '--config', "$PWD\emby_proxy.ini" -PassThru -NoNewWindow
          Start-Sleep 8
          $ini = Get-Content emby_proxy.ini -Raw
          # exe "onefile" = 2 processus : on arrete tout l'arbre
          taskkill /F /T /PID $p.Id | Out-Null
          Start-Sleep 2
          Write-Host $ini
          if ($ini -match "CLE-DE-TEST-123") { throw "cle API restee en clair" }
          if ($ini -notmatch "api_key = enc:dpapi:") { throw "cle API non chiffree par DPAPI" }
          if ($ini -notmatch "(?m)^password = \S+") { throw "mot de passe de la page absent" }
          Get-Content proxy.log
          if ((Get-Content proxy.log -Raw) -notmatch "cle API Emby : chiffree") { throw "cle relue impossible" }

      - name: Essai - service Windows
        shell: pwsh
        run: |
          Get-Process emby_proxy -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          foreach ($port in 8097, 8098) {
            if (Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue) { throw "port $port deja pris avant l'essai" }
          }
          Expand-Archive $env:ZIP -DestinationPath essai2
          cd essai2\EmbyProxy
          .\EmbyProxy-service.exe install
          .\EmbyProxy-service.exe start
          Start-Sleep 10
          $s = Get-Service EmbyProxy
          Write-Host "Etat : $($s.Status) / demarrage : $($s.StartType)"
          if ($s.Status -ne "Running") { Get-ChildItem *.log | ForEach-Object { Get-Content $_ }; throw "service non demarre" }
          $r = Invoke-WebRequest http://127.0.0.1:8098/__proxy/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "page d'administration injoignable" }
          # la page doit etre servie par le service lui-meme
          $owner = (Get-NetTCPConnection -LocalPort 8098 -State Listen).OwningProcess | Select-Object -First 1
          $svcpid = (Get-CimInstance Win32_Service -Filter "Name='EmbyProxy'").ProcessId
          $parents = @((Get-CimInstance Win32_Process -Filter "ProcessId=$owner").ParentProcessId)
          $parents += (Get-CimInstance Win32_Process -Filter "ProcessId=$($parents[0])").ParentProcessId
          Write-Host "port 8098 : processus $owner, parents $parents, service $svcpid"
          if ($parents -notcontains $svcpid) { throw "le port 8098 n'est pas tenu par le service" }
          $u = Invoke-WebRequest http://127.0.0.1:8097/ -UseBasicParsing -SkipHttpErrorCheck
          Write-Host "Port utilisateurs : $($u.StatusCode)"
          Write-Host "--- emby_proxy.ini ---"; Get-Content emby_proxy.ini | Select-String -Pattern "password|^\[" | ForEach-Object { $_.Line -replace '(password = ).+', '$1***' }
          Write-Host "--- journaux ---"; Get-ChildItem *.log | ForEach-Object { Write-Host "## $($_.Name)"; Get-Content $_ -Tail 30 }
          if ((Get-Content emby_proxy.ini -Raw) -notmatch "(?m)^password = (\S+)") { throw "mot de passe non cree" }
          $mdp = $Matches[1]
          $sess = New-Object Microsoft.PowerShell.Commands.WebRequestSession
          $lg = Invoke-WebRequest http://127.0.0.1:8098/__proxy/login -Method Post -Body @{password=$mdp} -Headers @{Origin='http://127.0.0.1:8098'} -WebSession $sess -UseBasicParsing -SkipHttpErrorCheck
          Write-Host "connexion a la page : $($lg.StatusCode)"
          if ($lg.StatusCode -ne 200) { throw "connexion a la page refusee" }
          # sans connexion valide, stats.json repond 401 (et l'essai echoue ici)
          $st = Invoke-WebRequest http://127.0.0.1:8098/__proxy/stats.json -WebSession $sess -UseBasicParsing
          $null = $st.Content | ConvertFrom-Json
          Write-Host "stats : $($st.Content.Substring(0, 80))"
          .\EmbyProxy-service.exe restart
          Start-Sleep 8
          if ((Get-Service EmbyProxy).Status -ne "Running") { throw "redemarrage du service" }
          .\EmbyProxy-service.exe stop
          for ($i = 0; $i -lt 30 -and (Get-Service EmbyProxy).Status -ne "Stopped"; $i++) { Start-Sleep 1 }
          .\EmbyProxy-service.exe uninstall
          # Windows retire le service quelques secondes plus tard
          for ($i = 0; $i -lt 30 -and (Get-Service EmbyProxy -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (Get-Service EmbyProxy -ErrorAction SilentlyContinue) { throw "desinstallation" }

      - name: Essai - scripts install_service.bat / uninstall_service.bat
        shell: pwsh
        run: |
          Get-Process emby_proxy -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          Expand-Archive $env:ZIP -DestinationPath essai3
          cd essai3\EmbyProxy
          # le vrai script, comme un double-clic (Entree pour le "pause" final)
          $out = cmd /c "echo.| install_service.bat" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "Admin page is ready: http://localhost:8098/") { throw "page d'administration non signalee prete" }
          if ($out -notmatch "Installing Emby Proxy \d+\.\d+\.\d+ as a Windows service") { throw "version absente de la console" }
          if ($out -notmatch "Emby Proxy \d+\.\d+\.\d+ installed and started") { throw "version absente du resume" }
          foreach ($fr in "Installation d'Emby", "Dossier", "Mot de passe", "Page d'administration", "Etape suivante") {
            if ($out -match [regex]::Escape($fr)) { throw "texte francais dans la console : $fr" }
          }
          if ((Get-Service EmbyProxy).Status -ne "Running") { throw "service non demarre" }
          $r = Invoke-WebRequest http://127.0.0.1:8098/__proxy/login -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "page d'administration injoignable" }
          if ($r.Content -notmatch "v\d+\.\d+\.\d+") { throw "version absente de la page" }
          if (-not (Get-NetFirewallRule -DisplayName "Emby Proxy - users" -ErrorAction SilentlyContinue)) { throw "regle de pare-feu absente" }
          if (-not (Get-NetFirewallRule -DisplayName "Emby Proxy - admin" -ErrorAction SilentlyContinue)) { throw "regle de pare-feu admin absente" }
          if (-not (Test-Path image_cache)) { throw "dossier image_cache absent" }
          $out2 = cmd /c "echo.| uninstall_service.bat" 2>&1 | Out-String
          Write-Host $out2
          for ($i = 0; $i -lt 30 -and (Get-Service EmbyProxy -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          if (Get-Service EmbyProxy -ErrorAction SilentlyContinue) { throw "service encore installe" }
          if (Get-NetFirewallRule -DisplayName "Emby Proxy - users" -ErrorAction SilentlyContinue) { throw "regle de pare-feu non retiree" }

      - uses: actions/upload-artifact@v4
        with:
          name: EmbyProxy-windows
          path: ${{ env.ZIP }}

      - name: Publication (Releases)
        if: env.TAG != 'dev'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ZIP }}
          name: Emby Proxy ${{ env.TAG }} for Windows / pour Windows
          body: |
            **English** - compiled version for Windows, installed as a service.

            1. Download EmbyProxy-${{ env.TAG }}-windows.zip below.
            2. Unzip it to C:\EmbyProxy.
            3. Double-click install_service.bat.
            4. Admin page: http://localhost:8098/

            Details: README.txt in the archive.

            **Français** - version compilee pour Windows, avec installation en service.

            1. Telecharge EmbyProxy-${{ env.TAG }}-windows.zip ci-dessous.
            2. Decompresse-le dans C:\EmbyProxy.
            3. Double-clic sur install_service.bat.
            4. Page d'administration : http://localhost:8098/

            Detail : README.txt dans l'archive.
